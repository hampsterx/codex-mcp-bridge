name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # OIDC trusted publishing requires npm >= 11.5.1. Node 22 ships with
      # npm 10, so upgrade the global npm before publishing. Pin to 11.18.0:
      # npm 12.0.0 (current `latest`) fails `publish --provenance` with
      # `Cannot find module 'sigstore'` because it no longer hoists sigstore to
      # npm/node_modules/sigstore, so the libnpmpublish it loads at runtime
      # can't resolve it. 11.18.0 hoists it correctly and still supports OIDC.
      - run: npm install -g npm@11.18.0
      - run: npm --version
      - run: npm publish --provenance --access public
