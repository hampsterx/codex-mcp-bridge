name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # OIDC trusted publishing requires npm >= 11.5.1. Node 22 ships with
      # npm 10, so upgrade the global npm before publishing. A global install
      # resolves npm's full bundled dependency tree; `npx --yes npm@latest`
      # does a partial install that omits transitive deps like sigstore, which
      # breaks `publish --provenance` with a MODULE_NOT_FOUND at runtime.
      - run: npm install -g npm@latest
      - run: npm --version
      - run: npm publish --provenance --access public
